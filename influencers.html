<script>
function initRotatingAd() {
  const container = document.getElementById('rotating-ad-container');
  
  function showAd() {

      container.style.display = 'none';
      container.innerHTML = '';
    }, 60000);
  }

  setInterval(showAd, 75000);
  setTimeout(showAd, 15000);
}

function triggerFakeDownload(button) {
  const statusDiv = button.nextElementSibling;
  button.disabled = true;
  button.style.opacity = '0.6';
  statusDiv.style.display = 'block';
  
  let progress = 0;
  const interval = setInterval(() => {
    progress += Math.floor(Math.random() * 15) + 10;
    if (progress >= 100) {
      progress = 100;
      clearInterval(interval);
      statusDiv.innerHTML = "✅ Ready!";
      
      setTimeout(() => {
        window.open("", "_blank");
        button.disabled = false;
        button.style.opacity = '1';
        statusDiv.style.display = 'none';
      }, 1500);
    } else {
      statusDiv.innerHTML = "Loading... " + progress + "%";
    }
  }, 400);
}

window.onload = initRotatingAd;
