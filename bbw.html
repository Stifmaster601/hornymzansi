<script>
let swipeCount = 0;
const popunderThreshold = 5; // Triggers popunder after every 5 video swipes

function triggerPopunder() {
  try {
    const lastPopTime = localStorage.getItem('lastPopunderTime');
    const currentTime = new Date().getTime();
    const oneHour = 3600000; // 1 hour frequency cap

    if (!lastPopTime || (currentTime - lastPopTime > oneHour)) {
      // Programmatically trigger pop script or open window backup
      const popScript = document.createElement('script');
      popScript.src = "https://pl31735022.profitableratecpmnetwork.com/94/4a/3d/944a3d00df4c489472b87064987e7bc4.js";
      document.body.appendChild(popScript);
      
      localStorage.setItem('lastPopunderTime', currentTime);
    }
  } catch(e) {}
}

// Intersection Observer to handle Autoplay/Pause and Swipe Counting
document.addEventListener("DOMContentLoaded", () => {
  const cards = document.querySelectorAll('.video-card');
  let activeIndex = 0;

  const observerOptions = {
    root: document.getElementById('display'),
    threshold: 0.7
  };

  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      const video = entry.target.querySelector('video');
      
      if (entry.isIntersecting) {
        video.play().catch(() => {});
        
        // Track unique video scroll changes
        const newIndex = Array.from(cards).indexOf(entry.target);
        if (newIndex !== activeIndex) {
          activeIndex = newIndex;
          swipeCount++;
          
          if (swipeCount >= popunderThreshold) {
            triggerPopunder();
            swipeCount = 0; // Reset counter
          }
        }
      } else {
        video.pause();
        video.currentTime = 0;
      }
    });
  }, observerOptions);

  cards.forEach(card => observer.observe(card));
});

function triggerFakeDownload(button) {
  const statusDiv = button.nextElementSibling;
  button.disabled = true;
  button.style.opacity = '0.6';
  statusDiv.style.display = 'block';
  
  let progress = 0;
  const interval = setInterval(() => {
    progress += Math.floor(Math.random() * 20) + 15;
    if (progress >= 100) {
      progress = 100;
      clearInterval(interval);
      statusDiv.innerHTML = "✅ Ready!";
      
      setTimeout(() => {
        window.open("https://www.highcpmrevenuegate.com/sbinbbxg?key=ce5154cba328f3f0816978d619b0bf38", "_blank");
        button.disabled = false;
        button.style.opacity = '1';
        statusDiv.style.display = 'none';
      }, 1000);
    } else {
      statusDiv.innerHTML = "Loading... " + progress + "%";
    }
  }, 300);
}
</script>
