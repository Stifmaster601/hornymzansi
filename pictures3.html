<style>

  --bg-primary: #0a0a0a;

  --accent-red-hover: #f40612;

* {

  padding: 0;
  box-sizing: border-box;

}

body {
  background-color: var(--bg-primary);
  color: var(--text-main);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
  padding-bottom: 80px;
}

a {

  color: inherit;
  transition: all 0.2s ease;
}

/* Header & Navigation Styling */
header {
  background: var(--bg-secondary);
  border-bottom: 1px solid var(--border-color);
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
  padding: 20px;
  text-align: center;
}

h1 {
  font-size: 30px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 2px;
  color: #008000;
  background-color: black;
  padding: 10px;
  display: inline-block;
  border-radius: 6px;
}

.brand-the { color: purple; background-color: white; padding: 0 4px; }
.brand-horny { color: orange; }
.brand-mzansi { background: white; color: black; text-shadow: gray 2px 2px; padding: 2px 8px; border-radius: 4px; }

nav {
  max-width: 600px;
  margin: 20px auto 0 auto;
}

nav ul {
  list-style: none;
  display: flex;
  justify-content: center;
  gap: 15px;
  padding: 14px;
  background: linear-gradient(Red, black, blue);
  border: 1px solid var(--border-color);
  border-radius: 6px;
}

nav li {
  width: 90px;
  background-color: yellow;
  border-radius: 4px;
  padding: 6px 0;
  text-align: center;
  font-family: Cursive;
  font-weight: bold;
}

nav li a {
  color: orange;
  font-size: 15px;
}

nav li:hover {
  background: var(--accent-red);
}

nav li:hover a {
  color: white;
}

/* Picture Gallery Grid Layout */
.gallery-grid {
  max-width: 1200px;
  margin: 30px auto;
  padding: 0 20px;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: 15px;
}

.gallery-card {
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: 10px;
  overflow: hidden;
  box-shadow: 0 4px 15px rgba(0,0,0,0.4);
  transition: all 0.3s ease;
  display: flex;
  flex-direction: column;
}

.gallery-card:hover {
  transform: translateY(-5px);
  border-color: var(--accent-red);
  box-shadow: 0 8px 20px rgba(229, 9, 20, 0.2);
}

.gallery-card img {
  width: 100%;
  height: 240px;
  object-fit: cover;
  display: block;
}

/* Ad Unit Containers */
.ad-container {
  max-width: 768px;
  margin: 30px auto;
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: 12px;
  padding: 15px;
  text-align: center;
  box-shadow: 0 6px 18px rgba(0,0,0,0.5);
}

.ad-label {
  font-size: 11px;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: 8px;
}

/* Pagination & Navigation Container */
.pagination-container {
  max-width: 600px;
  margin: 30px auto;
  text-align: center;
}

.next-btn-main {
  display: inline-block;
  background: var(--accent-red);
  color: white;
  padding: 12px 35px;
  border-radius: 30px;
  font-weight: bold;
  font-size: 16px;
  box-shadow: 0 4px 15px rgba(229, 9, 20, 0.4);
  margin-bottom: 25px;
  transition: all 0.3s ease;
}

.next-btn-main:hover {
  background: var(--accent-red-hover);
  transform: translateY(-2px);
}

.pagination-buttons {
  background: #151515;
  border: 1px solid var(--border-color);
  padding: 15px;
  border-radius: 12px;
  display: inline-flex;
  gap: 10px;
  justify-content: center;
}

.pagination-buttons button {
  width: 50px;
  height: 50px;
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: 8px;
  cursor: pointer;
  transition: all 0.2s ease;
}

.pagination-buttons button:hover {
  background: var(--accent-red);
  border-color: var(--accent-red);
}

.pagination-buttons button a {
  display: flex;
  justify-content: center;
  align-items: center;
  width: 100%;
  height: 100%;
  color: white;
  font-weight: bold;
  text-decoration: none;
}

hr {

  height: 1px;
  background: var(--border-color);
  margin: 20px 0;
}
