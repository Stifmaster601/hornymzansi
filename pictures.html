<style>
:root {
  --bg-primary: #0a0a0a;
  --bg-secondary: #121212;
  --bg-card: #181818;
  --accent-red: #e50914;
  --accent-red-hover: #f40612;
  --accent-orange: #ff9900;
  --text-main: #ffffff;
  --text-muted: #b3b3b3;
  --border-color: #282828;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}

body {
  background-color: var(--bg-primary);
  color: var(--text-main);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
  padding-bottom: 80px;
}

a {
  text-decoration: none;
  color: inherit;
  transition: all 0.2s ease;
}

/* Header & Navigation Styling */
header {
  background: var(--bg-secondary);
  border-bottom: 1px solid var(--border-color);
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
  padding: 20px;
  text-align: center;
}

h1 {
  font-size: 30px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 2px;
  color: #008000;
  background-color: black;
  padding: 10px;
}

.brand-the { color: purple; background-color: white; padding: 0 4px; }
.brand-horny { color: orange; }
.brand-mzansi { background: white; color: black; text-shadow: gray 2px 2px; padding: 2px 8px; border-radius: 4px; }

nav {
  max-width: 600px;
  margin: 20px auto 0 auto;
}

nav ul {
  list-style: none;
  display: flex;
  justify-content: center;
  gap: 15px;
  padding: 14px;
  background: linear-gradient(Red, black, blue);
  border: 1px solid var(--border-color);
  height: auto;
  border-radius: 6px;
}

nav li {
  width: 90px;
  background-color: yellow;
  border-radius: 4px;
  padding: 6px 0;
  text-align: center;
  font-family: Cursive;
  font-weight: bold;
}

nav li a {
  color: orange;
  font-size: 15px;
}

nav li:hover {
  background: var(--accent-red);
}

nav li:hover a {
  color: white;
}

/* Picture Gallery Grid Layout (Stops Zoom/Unzoom issues on Mobile & PC) */
.gallery-grid {
  max-width: 1200px;
  margin: 30px auto;
  padding: 0 20px;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: 15px;
}

.gallery-card {
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: 10px;
  overflow: hidden;
  box-shadow: 0 4px 15px rgba(0,0,0,0.4);
  transition: all 0.3s ease;
  display: flex;
  flex-direction: column;
}

.gallery-card:hover {
  transform: translateY(-5px);
  border-color: var(--accent-red);
  box-shadow: 0 8px 20px rgba(229, 9, 20, 0.2);
}

.gallery-card img {
  width: 100%;
  height: 240px;
  object-fit: cover;
  display: block;
}

/* Playable Video-Card Style Ad Wrappers */
.ad-video-card {
  max-width: 768px;
  margin: 30px auto;
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 0 6px 18px rgba(0,0,0,0.5);
}

.ad-video-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 15px;
  background: rgba(0,0,0,0.4);
  font-size: 13px;
  color: var(--text-muted);
}

.ad-badge {
  background: var(--accent-red);
  color: white;
  padding: 2px 8px;
  border-radius: 4px;
  font-size: 11px;
  font-weight: bold;
  text-transform: uppercase;
}

.ad-player-screen {
  position: relative;
  width: 100%;
  min-height: 90px;
  display: flex;
  justify-content: center;
  align-items: center;
  background: #000;
  overflow: hidden;
}

.ad-player-overlay {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0, 0, 0, 0.15);
  display: flex;
  justify-content: center;
  align-items: center;
  pointer-events: none;
}

.play-button-circle {
  width: 45px;
  height: 45px;
  background: rgba(229, 9, 20, 0.85);
  border-radius: 50%;
  display: flex;
  justify-content: center;
  align-items: center;
  box-shadow: 0 0 15px rgba(229, 9, 20, 0.6);
}

.play-button-circle::after {
  content: '';
  display: block;
  width: 0;
  height: 0;
  border-top: 8px solid transparent;
  border-bottom: 8px solid transparent;
  border-left: 14px solid white;
  margin-left: 3px;
}

/* Fake Download Buttons Section */
.download-section {
  max-width: 768px;
  margin: 30px auto;
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  padding: 20px;
  border-radius: 12px;
  text-align: center;
}

.download-section h3 {
  margin-bottom: 15px;
  font-size: 18px;
  color: var(--text-main);
}

.fake-download-btn {
  display: block;
  width: 100%;
  background: linear-gradient(135deg, #00b09b, #96c93d);
  color: white;
  padding: 14px;
  margin: 10px 0;
  border-radius: 8px;
  font-weight: bold;
  font-size: 16px;
  text-transform: uppercase;
  box-shadow: 0 4px 15px rgba(0, 176, 155, 0.4);
  transition: all 0.3s ease;
}

.fake-download-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(0, 176, 155, 0.6);
}

.fake-download-btn.alt {
  background: linear-gradient(135deg, #ff416c, #ff4b2b);
  box-shadow: 0 4px 15px rgba(255, 65, 108, 0.4);
}

.fake-download-btn.alt:hover {
  box-shadow: 0 6px 20px rgba(255, 65, 108, 0.6);
}

/* Pagination Container */
.pagination-container {
  max-width: 600px;
  margin: 30px auto;
  text-align: center;
}

.next-btn-main {

  background: var(--accent-red);
  color: white;
  padding: 12px 35px;
  border-radius: 30px;
  font-weight: bold;
  font-size: 16px;
  box-shadow: 0 4px 15px rgba(229, 9, 20, 0.4);
  margin-bottom: 25px;

.next-btn-main:hover {

#dijo {

#dijo table {

#dijo button:hover {

#dijo button a {

  color: white;
  text-decoration: none;

hr {

  background: var(--border-color);
  margin: 20px 0;
